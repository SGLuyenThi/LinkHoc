<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tổng hợp link</title>
<style>
:root{
  --bg:#f3f8ff;
  --line:#b9d4f5;
  --title:#1e63b8;
  --chip:#eef5ff;
  --chip-line:#d4e5fa;
  --chip-hover:#dcebff;
  --text:#1f2d3d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 16px;font-size:24px;color:var(--title);text-align:center}
#q{display:block;width:100%;max-width:480px;margin:0 auto 28px;padding:12px 18px;font-size:16px;
  border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--text);outline:none}
#q:focus{border-color:var(--title);box-shadow:0 0 0 3px #1e63b822}

fieldset{margin:0 0 26px;padding:18px 16px 16px;background:#fff;border:1.5px solid var(--line);border-radius:16px;min-width:0}
legend{margin-left:8px;padding:0 10px;font-size:17px;font-weight:700;color:var(--title)}
legend small{font-weight:400;color:#7f9bbd;margin-left:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
a.card{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--chip);
  border:1px solid var(--chip-line);border-radius:10px;color:inherit;text-decoration:none;font-size:15px;
  transition:background .15s,transform .15s}
a.card:hover{background:var(--chip-hover);transform:translateY(-1px)}
a.card img{width:20px;height:20px;flex:none;border-radius:4px}
a.card span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.msg{text-align:center;color:#7f9bbd;padding:24px}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tổng hợp link</h1>
  <input id="q" type="search" placeholder="Tìm kiếm link..." autocomplete="off">
  <div id="app"><div class="msg">Đang tải...</div></div>
</div>

<script>
const app = document.getElementById('app');
const q = document.getElementById('q');
let data = [];

fetch('links.json?' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { data = d; render(''); })
  .catch(() => { app.innerHTML = '<div class="msg">Không tải được links.json. Kiểm tra lại tên file và cú pháp JSON.</div>'; });

q.addEventListener('input', e => render(e.target.value.trim().toLowerCase()));

function safeUrl(u) {
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x : null; } catch { return null; }
}

function render(term) {
  app.textContent = '';
  let shown = 0;

  data.forEach(sec => {
    const links = (sec.links || []).filter(l =>
      !term || (l.title + ' ' + sec.section).toLowerCase().includes(term));
    if (!links.length) return;
    shown++;

    const box = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.textContent = sec.section + ' ';
    const n = document.createElement('small');
    n.textContent = '(' + links.length + ')';
    lg.appendChild(n);
    box.appendChild(lg);

    const grid = document.createElement('div');
    grid.className = 'grid';

    links.forEach(l => {
      const u = safeUrl(l.url);
      if (!u) return;
      const a = document.createElement('a');
      a.className = 'card';
      a.href = u.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = 'https://www.google.com/s2/favicons?domain=' + u.hostname + '&sz=64';
      img.onerror = () => img.remove();

      const t = document.createElement('span');
      t.textContent = l.title;

      a.append(img, t);
      grid.appendChild(a);
    });

    box.appendChild(grid);
    app.appendChild(box);
  });

  if (!shown) app.innerHTML = '<div class="msg">Không tìm thấy link phù hợp.</div>';
}
</script>
</body>
</html>
